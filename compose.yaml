name: safevault
services:
  app:
    image: safevault-app:local
    build:
      context: .
    ports:
      - "127.0.0.1:${SAFEVAULT_PORT:-8080}:8080"
    environment:
      SAFEVAULT_MAX_UPLOAD_BYTES: "${SAFEVAULT_MAX_UPLOAD_BYTES:-26214400}"
      SAFEVAULT_SESSION_TTL: "${SAFEVAULT_SESSION_TTL:-8h}"
      SAFEVAULT_SESSION_IDLE_TTL: "${SAFEVAULT_SESSION_IDLE_TTL:-30m}"
      SAFEVAULT_COOKIE_SECURE: "${SAFEVAULT_COOKIE_SECURE:-false}"
      SAFEVAULT_PUBLIC_ORIGIN: "${SAFEVAULT_PUBLIC_ORIGIN:-}"
      SAFEVAULT_HOST_STORAGE_FILE: "${SAFEVAULT_HOST_STORAGE_FILE:-/run/safevault-host/storage.json}"
    volumes:
      - vault-data:/data
      - type: bind
        source: ./.runtime/host-storage
        target: /run/safevault-host
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 20s
    mem_limit: 512m
    cpus: 2
volumes:
  vault-data:
