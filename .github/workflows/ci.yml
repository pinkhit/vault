name: Milestone 1 checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check formatting, backend, and race detector
        working-directory: backend
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race -cover ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /tmp/vault-amd64 ./cmd/server
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /tmp/vault-arm64 ./cmd/server
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci
          npm run format:check
          npm test
          npm run build
      - name: Browser check
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Compose persistence smoke test
        run: ./tests/compose-smoke.sh
